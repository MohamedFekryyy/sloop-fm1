name: ble-spike-target-build
# SPIKE ONLY: compile-size evidence for the minimal receive-only BLE integration (draft branch
# ble-spike). No release, no merge, no publication, no signing. Public fork: Actions minutes are free.
on:
  push:
    branches: [ble-spike]
  workflow_dispatch:

jobs:
  sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JieLi pi32v2 toolchain
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 --max-time 600 https://pkgman.jieliapp.com/s/linux-toolchain -o /tmp/tc.tar.xz
          tar -xJf /tmp/tc.tar.xz -C ~/.jieli
          TCROOT=$(ls -d ~/.jieli/jieli-linux-toolchains-*/ | head -1)
          echo "toolchain root: $TCROOT"
          ls -la "$TCROOT/pi32v2/bin/" | head -20
          ln -sfn "${TCROOT%/}" ~/.jieli/toolchain
          ls -la ~/.jieli/
          CLANG=$(find -L ~/.jieli/toolchain -path '*/pi32v2/bin/clang*' -type f | head -1)
          echo "clang found at: $CLANG"
          test -n "$CLANG"
          "$CLANG" --version | head -1
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: Clone AC79 SDK (packaging files only)
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 -b AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            echo "sdk attempt $i failed; retrying"; sleep 15
          done
          test -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: Python deps
        run: pip3 install Pillow
      - name: Build baseline (FELUCCA_BLE=0)
        run: |
          set -o pipefail
          python3 tools/build.py 2>&1 | tail -15
          cp build/felucca.bin build/baseline.bin
      - name: Feature size map (baseline, exact from the linked elf)
        run: |
          ~/.jieli/toolchain/common/bin/objdump -t build/felucca.elf > /tmp/syms.txt
          python3 - <<'PY'
          rows = []
          for ln in open("/tmp/syms.txt"):
              t = ln.rsplit(None, 3)
              if len(t) == 4 and all(c in "0123456789abcdef" for c in t[2]) and int(t[2], 16) >= 512:
                  rows.append((int(t[2], 16), t[3], t[1].strip()))
          rows.sort(reverse=True)
          for n, name, sect in rows[:30]:
              print(f"{n:>8} B  {sect:<10} {name}")
          PY
      - name: Build minimal receive-only BLE (FELUCCA_BLE=1)
        continue-on-error: true   # exploratory: expected to overflow the slot; the size report carries its number
        run: |
          set -o pipefail
          FELUCCA_BLE=1 python3 tools/build.py 2>&1 | tail -40
          cp build/felucca.bin build/ble.bin
      - name: Build BLE + USB audio off (FELUCCA_BLE=1 FELUCCA_UAC=0)
        if: always()
        continue-on-error: true   # exploratory: expected to overflow the slot
        run: |
          set -o pipefail
          FELUCCA_BLE=1 FELUCCA_UAC=0 python3 tools/build.py 2>&1 | tail -20
          cp build/felucca.bin build/ble_uac0.bin
      - name: Build BLE + all non-sample trims (BLE=1 UAC=0 ICONS=0 LOGO_TEXT=1)
        if: always()
        continue-on-error: true   # exploratory: expected to overflow the slot
        run: |
          set -o pipefail
          FELUCCA_BLE=1 FELUCCA_UAC=0 FELUCCA_ICONS=0 FELUCCA_LOGO_TEXT=1 python3 tools/build.py 2>&1 | tail -20
          cp build/felucca.bin build/ble_trim.bin
      - name: "Build the chosen fit: BLE + text logo + HORNS silent (real slot)"
        if: always()
        run: |
          set -o pipefail
          git checkout -- firmware/app.ld 2>/dev/null || true   # the real slot: undo any earlier enlargement
          FELUCCA_BLE=1 FELUCCA_LOGO_TEXT=1 FELUCCA_SKIP_SETS=HORNS python3 tools/build.py 2>&1 | tail -25
          cp build/felucca.bin build/ble_chosen.bin
      - name: "RAM/pool measurement: BLE+trims, XIP window enlarged (MEASUREMENT ONLY, not a shippable image)"
        if: always()
        run: |
          sed -i 's/LENGTH = 0x8DFBC/LENGTH = 0x9DFBC/' firmware/app.ld
          set +e
          FELUCCA_BLE=1 FELUCCA_UAC=0 FELUCCA_ICONS=0 FELUCCA_LOGO_TEXT=1 python3 tools/build.py 2>&1 | grep -E "  ok|FAIL|image [0-9]|overflow|exceeds" | head -25
          echo "(build 'failure' above is the app-slot check after a successful link - the ok/FAIL lines are the data)"
          ~/.jieli/toolchain/common/bin/objdump -t build/felucca.elf > /tmp/syms_ble.txt 2>/dev/null
          python3 - <<'PY'
          import os
          if os.path.exists("/tmp/syms_ble.txt"):
              rows = []
              for ln in open("/tmp/syms_ble.txt"):
                  t = ln.rsplit(None, 3)
                  if len(t) == 4 and all(c in "0123456789abcdef" for c in t[2]) and int(t[2], 16) >= 256:
                      rows.append((int(t[2], 16), t[3]))
              ble = sorted((r for r in rows if "ble" in r[1].lower() or r[1].startswith("blr_")), reverse=True)
              tot = sum(n for n, _ in ble)
              print(f"BLE symbols total: {tot} B across {len(ble)} symbols; largest:")
              for n, name in ble[:15]:
                  print(f"{n:>8} B  {name}")
          PY
          git checkout -- firmware/app.ld || true
          exit 0
      - name: Size report
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          SLOT = 581564
          # exact per-set sample footprint from the generated zone table
          try:
              h = open("build/gen/felucca_samples.h").read()
              zb = h[h.find("SMP_ZONES["):h.find("SMP_SETS[")]
              zones = [(int(a), int(b)) for a, b in re.findall(r"\{(\d+), (\d+), \d+, \d+, \d+, \d+, \d+, \d+, \d+, \d+, \d+\},", zb)]
              sb = h[h.find("SMP_SETS["):]
              for name, z0, nz in re.findall(r'\{"([A-Z]+)", (\d+), (\d+)\},', sb):
                  zs = zones[int(z0):int(z0) + int(nz)]
                  if zs:
                      size = zs[-1][0] + (zs[-1][1] + 1) // 2 - zs[0][0]
                      print(f"sample set {name}: {size} B across {len(zs)} zones")
          except Exception as e:
              print("sample breakdown failed:", e)
          for f, label in (("build/baseline.bin", "baseline"),
                           ("build/ble.bin", "BLE"),
                           ("build/ble_uac0.bin", "BLE + UAC off"),
                           ("build/ble_trim.bin", "BLE + UAC off + icons off + text logo"),
                           ("build/ble_chosen.bin", "BLE + text logo + HORNS silent (chosen)")):
              if os.path.exists(f):
                  n = os.path.getsize(f)
                  print(f"{label}: {n} B of {SLOT} B slot; {'FREE ' + str(SLOT - n) if n <= SLOT else 'OVER BY ' + str(n - SLOT)}")
              else:
                  print(f"{label}: not produced")
          PY
      - name: "Baseline binary equivalence: FELUCCA_BLE=0 build vs the pre-BLE tree (3f2f54f)"
        if: always()
        run: |
          set -o pipefail
          git fetch --depth 1 origin 3f2f54fa6d0eb108781d1abc6812cb37ede27ee5
          git worktree add --detach /tmp/preb 3f2f54fa6d0eb108781d1abc6812cb37ede27ee5
          (cd /tmp/preb && python3 tools/build.py > /tmp/preb.log 2>&1)
          if cmp -s /tmp/preb/build/felucca.bin build/baseline.bin; then
            echo "BASELINE BINARY IDENTICAL to the pre-BLE tree (3f2f54f)"
          else
            echo "BASELINE BINARY DIFFERS from the pre-BLE tree"
            ls -l /tmp/preb/build/felucca.bin build/baseline.bin
            exit 1
          fi
      - name: Host test suite (incl. BLE clock source test)
        if: always()
        run: |
          set -o pipefail
          git checkout -- firmware/app.ld 2>/dev/null || true
          bash tests/run_tests.sh 2>&1 | tail -45
      - name: Upload firmware images (evidence, not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ble-spike-firmware
          path: |
            build/baseline.bin
            build/ble_chosen.bin
          if-no-files-found: ignore
          retention-days: 30
